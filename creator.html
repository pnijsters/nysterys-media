  <!-- Fonts -->
  <style>
/* ─── Reset ─────────────────────────────────────────── */

    /* ─── Design tokens ──────────────────────────────────── */

    /* ─── Base ───────────────────────────────────────────── */

    /* Grain overlay */

    /* ─── Navigation ─────────────────────────────────────── */

    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--orange);
      text-decoration: none;
      border: 1px solid var(--orange);
      padding: 0.5rem 1.25rem;
      transition: background 0.2s, color 0.2s;
    }

    .nav-back:hover {
      background: var(--orange);
      color: var(--black);
    }

    .nav-back svg {
      width: 12px;
      height: 12px;
    }

    /* ─── Hero ───────────────────────────────────────────── */
    .creator-hero {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: end;
    }

    .hero-photo-wrap {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    .hero-photo-wrap img {
      width: 100%;
      height: 115%; /* extra height for parallax travel */
      object-fit: cover;
      object-position: top;
      display: block;
      filter: brightness(0.85);
      will-change: transform;
      transform-origin: top center;
    }

    /* The rule above outranks the browser's own [hidden] { display: none }, so without this
       the photo keeps its box while it waits for a src and paints the alt text as a broken
       image. Two paths depend on the attribute meaning what it says: the img ships hidden and
       is shown once a real photo loads, and page-creator.js re-hides it in the onerror. */
    .hero-photo-wrap img[hidden] {
      display: none;
    }

    /* Gradient to blend photo into the dark right panel */
    .hero-photo-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right,  transparent 60%, var(--black) 100%),
        linear-gradient(to top,    var(--black) 0%,  transparent 30%);
    }

    .hero-info {
      padding: 8rem 4rem 5rem 3rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .hero-tag {
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeUp 0.7s 0.2s forwards;
    }

    .hero-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(5rem, 10vw, 9rem);
      line-height: 0.9;
      letter-spacing: 0.03em;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 0.7s 0.35s forwards;
    }

    .hero-bio {
      font-size: 1rem;
      line-height: 1.8;
      color: #aaaaaa;
      max-width: 460px;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.7s 0.5s forwards;
    }

    /* Followers / likes / engagement row */
    .hero-stats {
      display: flex;
      gap: 2.5rem;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.7s 0.65s forwards;
    }

    .hero-stat-val {
      display: block;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      color: var(--orange);
      line-height: 1;
    }

    .hero-stat-lbl {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Per-platform breakdown. Quiet by design: the orange hero figures above
       are the one moment of heat, so this reads as supporting evidence rather
       than competing for the same glance. Mirrors the roster card treatment. */
    .hero-platforms {
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      margin-bottom: 2.5rem;
      max-width: 30rem;
      opacity: 0;
      animation: fadeUp 0.7s 0.8s forwards;
    }

    .hero-platforms-lbl {
      font-size: 0.55rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #5c5c5c;
      margin-bottom: 0.7rem;
    }

    .hero-platform-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .hero-platform {
      display: grid;
      grid-template-columns: 13px 4.75rem 1fr;
      align-items: center;
      gap: 0.65rem;
      padding: 0.3rem 0;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .hero-platform-icon {
      display: inline-flex;
      color: #5c5c5c;
    }

    .hero-platform-icon svg {
      width: 13px;
      height: 13px;
    }

    .hero-platform-name {
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #7a7a7a;
    }

    /* Min-widths align the columns between rows. Deliberately not subgrid:
       where subgrid is unsupported the declaration is dropped and every figure
       stacks onto its own line, a far worse failure than a little drift. */
    .hero-platform-figs {
      display: flex;
      align-items: baseline;
      font-variant-numeric: tabular-nums;
    }

    .fig-followers { min-width: 3rem; }
    .fig-views     { min-width: 6.2rem; }

    .hero-platform-sep {
      color: #3d3d3d;
      padding: 0 0.45rem;
    }

    @media (max-width: 700px) {
      /* The icon already identifies the platform, so the name column yields
         first and the figures keep their width. */
      .hero-platform {
        grid-template-columns: 13px 1fr;
      }

      .hero-platform-name {
        display: none;
      }
    }

    .hero-socials {
      display: flex;
      /* Without this the row's min-content is 418px, and .hero-info is a grid item whose
         default min-width: auto refuses to shrink below it, so the whole page scrolls
         sideways on a phone. */
      flex-wrap: wrap;
      gap: 0.75rem;
      opacity: 0;
      animation: fadeUp 0.7s 0.95s forwards;
    }

    .hero-social {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      transition: border-color 0.2s, color 0.2s;
    }

    .hero-social:hover {
      border-color: var(--orange);
      color: var(--orange);
    }

    .hero-social svg {
      width: 13px;
      height: 13px;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ─── Divider ─────────────────────────────────────────── */

    /* ─── Audience section ────────────────────────────────── */
    .audience {
      padding: 6rem 3rem 7rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: 0.04em;
    }

    /* ─── Charts grid ─────────────────────────────────────── */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 2rem;
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2rem;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.6s ease, transform 0.6s ease, border-color 0.3s;
    }

    .chart-card:hover {
      border-color: rgba(255, 92, 0, 0.4);
    }

    /* Orange top bar on hover */
    .chart-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(to right, var(--orange), var(--orange2));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s ease;
    }

    .chart-card:hover::before {
      transform: scaleX(1);
    }

    .chart-title {
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 1.75rem;
    }

    /* ─── Gender donut chart ──────────────────────────────── */
    .donut-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
    }

    .donut-svg {
      width: 140px;
      height: 140px;
      /* rotate so the first segment starts at the top */
      transform: rotate(-90deg);
    }

    .donut-legend {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .legend-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
    }

    .legend-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-label {
      color: #aaaaaa;
    }

    .legend-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      color: var(--orange);
    }

    /* ─── Distribution bars (shared by any label + value + bar list) ─ */
    .dist-bars {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .dist-row {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .dist-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
    }

    .dist-meta-label {
      color: var(--muted);
    }

    /* Sample size sits with its band so a percentage is never read without it:
       "1M+ 4%" means something different at 20 posts than at 900. */
    .dist-count {
      color: #5c5c5c;
      font-size: 0.68rem;
      margin-left: 0.55rem;
    }

    .dist-meta-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.95rem;
      color: var(--white);
    }

    .bar-track {
      height: 4px;
      background: var(--border);
      position: relative;
      overflow: hidden;
    }

    .bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0;
      background: linear-gradient(to right, var(--orange), var(--orange2));
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ─── Per-platform card rows ──────────────────────────── */

    /* Provenance sits on the CARD now, not the section: each one covers a
       different set of platforms, so one header note would be wrong for six of
       the seven. */
    .chart-note {
      margin-left: 0.6rem;
      color: #5c5c5c;
    }

    /* Mark, name, bar, figure. The bar absorbs the slack, so every figure on the
       card lands on one right edge and the column can be read straight down. */
    /* The item owns the padding and the rule; the row inside it is only the line
       of mark, name, bar and figure. A secondary line sits under that row and
       still inside the item, so the rule lands between platforms, never
       through one. */
    .pf-item + .pf-item {
      border-top: 1px solid var(--border);
      margin-top: 0.7rem;
      padding-top: 0.7rem;
    }

    .pf-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* The mix, under the total it adds up to. Dim, because the total is the
       comparison and this is the texture behind it. */
    .pf-sub {
      margin: 0.35rem 0 0 calc(14px + 0.75rem);
      font-size: 0.68rem;
      color: #5c5c5c;
    }

    .pf-icon, .pf-icon svg { width: 14px; height: 14px; }
    .pf-icon { display: flex; flex: none; color: #8a8a8a; }

    .pf-name { flex: none; width: 4.75rem; font-size: 0.75rem; color: var(--dim); }

    .pf-bar { flex: 1 1 auto; min-width: 1.5rem; }

    /* Bebas on the figure, so the number outranks the label beside it. */
    .pf-val {
      flex: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
    }

    /* The strongest platform on this metric, and nothing else, gets the orange.
       An accent on every row is decoration; on one row it is information. */
    .pf-val-lead { color: var(--orange); }

    /* An absence is stated, never blank: a platform she is on that this metric
       cannot measure must not read as an audience of zero. */
    .pf-row-absent .pf-icon, .pf-row-absent .pf-name { opacity: 0.45; }

    .pf-absent {
      margin-left: auto;
      font-size: 0.62rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #5c5c5c;
    }

    /* Where the categories differ per platform (For You against Shorts Feed),
       each platform keeps its own labelled panel rather than sharing a scale
       that would imply the two axes are the same thing. */
    .chart-card { grid-column: span 2; }
    .chart-card-wide { grid-column: span 3; }

    .pf-panel + .pf-panel { margin-top: 1.75rem; }

    .pf-panel-head {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.9rem;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--dim);
    }

    /* ─── Country bars ────────────────────────────────────── */
    .country-bars {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .country-row {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .country-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
    }

    .country-name {
      color: var(--white);
    }

    .country-pct {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.95rem;
      color: var(--white);
    }

    /* One accent per panel, on the row that leads it. @see site/page-creator.js
       buildCountryBars for why every row in orange is worse than one. */
    .country-pct-lead { color: var(--orange); }

    /* ─── Footer ──────────────────────────────────────────── */

    .rc-error {
      padding: 4rem;
      color: var(--muted);
    }

    /* ─── Responsive ──────────────────────────────────────── */

    /* Between the phone stack and the full three-up, two cards across. Three at
       this width leaves each bar about 60px and wraps every secondary line, so
       the comparison the card exists to make stops being readable. */
    @media (min-width: 901px) and (max-width: 1150px) {
      .chart-card { grid-column: span 3; }
    }

    @media (max-width: 900px) {

      .creator-hero {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .hero-photo-wrap {
        height: 60vw;
        min-height: 280px;
      }

      /* On mobile the photo sits above, so adjust gradient */
      .hero-photo-overlay {
        background: linear-gradient(to top, var(--black) 0%, transparent 50%);
      }

      .hero-info {
        padding: 2.5rem 1.5rem 3rem;
      }

      .charts-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .chart-card, .chart-card-wide { grid-column: auto; }

      .audience {
        padding: 4rem 1.5rem 5rem;
      }

    }
  </style>
